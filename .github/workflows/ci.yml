name: CI

on:
  # `staging` aussi : une PR fusionnée en squash y laisse un commit neuf, que
  # `main` n'accepte qu'avec ses checks verts (voir GIT-009).
  push:
    branches: [main, staging]
  pull_request:

# Le dépôt est un **workspace pnpm** : une seule installation à la racine, un
# seul `pnpm-lock.yaml`, un magasin mutualisé. Chaque app garde en revanche son
# job, qui passe une à une les étapes de son script `verifier` : un échec se lit
# au nom de l'étape, sans ouvrir le journal. Une porte ajoutée au `verifier`
# d'une app s'ajoute aussi à son job, sous le même nom.
#
# `--filter <app>` cible une app. `pnpm install` reste global : le lock l'est, et
# le cache pnpm rend la répétition entre jobs peu coûteuse.
jobs:
  simulateur-eligibilite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # La version de pnpm vient de `packageManager` à la racine, pas d'ici.
      - uses: actions/setup-node@v7
        with:
          # La version supportée est déclarée par la racine (`engines.node`), pas ici.
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Le `build` passe aussi la vérification de bundle, en `postbuild`.
      - name: lint
        run: pnpm --filter simulateur-eligibilite lint
      - name: typecheck
        run: pnpm --filter simulateur-eligibilite typecheck
      - name: knip
        run: pnpm --filter simulateur-eligibilite knip
      - name: test
        run: pnpm --filter simulateur-eligibilite test
      - name: build
        run: pnpm --filter simulateur-eligibilite build

  # Les parcours en navigateur réel, sous Chromium et WebKit : le simulateur
  # construit, embarqué en iframe dans une page d'une autre origine. Ils ont
  # leur job, hors du `verifier` : ils demandent des navigateurs installés, que
  # le poste d'un contributeur n'a pas forcément (voir le README de l'app).
  navigateur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter simulateur-eligibilite exec playwright install --with-deps chromium webkit
      - run: pnpm --filter simulateur-eligibilite test:navigateur
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: parcours-en-navigateur
          path: apps/simulateur-eligibilite/navigateur/resultats
          retention-days: 7

  datahub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm --filter datahub lint
      - name: typecheck
        run: pnpm --filter datahub typecheck
      - name: knip
        run: pnpm --filter datahub knip
      - name: test
        run: pnpm --filter datahub test

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pas de tests : voir l'ADR-0005.
      - name: lint
        run: pnpm --filter cli lint
      - name: typecheck
        run: pnpm --filter cli typecheck
      - name: knip
        run: pnpm --filter cli knip

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pas de tests ni de knip : l'app n'est encore qu'une coquille.
      - name: lint
        run: pnpm --filter dashboard lint
      - name: typecheck
        run: pnpm --filter dashboard typecheck
      - name: build
        run: pnpm --filter dashboard build

  # L'audit ne se scope pas : `pnpm audit` lit le lock, et le lock est unique au
  # dépôt depuis le passage en workspace. Le répéter dans chaque job
  # auditerait plusieurs fois la même chose en laissant croire le contraire. Il a
  # donc son job, qui tient aussi le contrôle des `AGENTS.md` générés : un
  # contrôle du dépôt entier, pas d'une app (ADR-0011).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ce qui part en production : bloquant.
      - run: pnpm audit --prod --audit-level high
      # La chaîne de build : signalé, non bloquant. Une alerte sur un paquet
      # transitif de Vite ne doit pas coincer une correction sans rapport.
      - run: pnpm audit --audit-level high
        continue-on-error: true
      # La version d'agent-smith vient de `mise.toml`, comme en local.
      - uses: jdx/mise-action@v5
        with:
          install_args: uv pipx:agent-smith-cli
      - name: AGENTS.md est généré
        run: |
          pnpm agents
          if ! git diff --exit-code -- '*AGENTS.md'; then
            echo "::error::AGENTS.md est généré : modifie la source puis lance 'pnpm agents'."
            exit 1
          fi

  # Scan de secrets sur **tout** l'historique, pas seulement le diff : un secret
  # commité puis retiré reste lisible dans les objets git. Le dépôt étant public,
  # GitHub scanne déjà les motifs des fournisseurs connus. gitleaks ajoute les
  # trois secrets propres au projet (clé Grist, secret de pseudonymisation, jeton
  # Matomo), que rien d'autre ne sait reconnaître (cf. .gitleaks.toml).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --no-banner --redact
