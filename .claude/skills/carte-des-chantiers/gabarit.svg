<svg width="100%" viewBox="0 0 680 860" role="img"><title>Chantiers de la v10 au JJ mois</title><desc>Une phrase : ce qui est terminé, ce qui est en cours, ce qui attend l'éditeur.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- Grille : largeur 680, marge 40. Rangée de 4 cases : w=135, x=40,195,350,505. Rangée de 5 : w=110, x=45,165,285,405,525. Rangée de 3 : w=190, x=40,245,450. Case : h=56 (ou 50 dans un cadre), titre à y+18, sous-titre à y+38. Recalculer la hauteur du viewBox : bas de la légende + 30. -->

<!-- 1. Socle, cadre vert en pointillés -->
<rect x="30" y="30" width="620" height="152" rx="12" fill="none" stroke="#3B6D11" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="44" y="46" dominant-baseline="central">Socle : générique, ne sait rien du métier</text>
<g class="c-green"><rect x="45" y="60" width="137" height="50" rx="8" stroke-width="0.5"/><text class="th" x="113" y="76" text-anchor="middle" dominant-baseline="central">02 Dossiers</text><text class="ts" x="113" y="95" text-anchor="middle" dominant-baseline="central">socle ≠ modèles</text></g>
<g class="c-blue"><rect x="525" y="120" width="110" height="50" rx="8" stroke-width="0.5"/><text class="th" x="580" y="136" text-anchor="middle" dominant-baseline="central">PDF périmé</text><text class="ts" x="580" y="155" text-anchor="middle" dominant-baseline="central">cap. 26, #130</text></g>

<!-- 2. Étape qui en débloque une autre, posée au-dessus d'elle -->
<line x1="107" y1="182" x2="107" y2="278" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="505" y="200" width="135" height="50" rx="8" stroke-width="0.5"/><text class="th" x="572" y="216" text-anchor="middle" dominant-baseline="central">Étape 0</text><text class="ts" x="572" y="235" text-anchor="middle" dominant-baseline="central">#126, v10.1.0</text></g>
<line x1="572" y1="250" x2="572" y2="278" class="arr" marker-end="url(#arrow)"/>

<!-- 3. Chaîne du chantier : rangée A, retour à la ligne en L, rangée B -->
<g class="c-green"><rect x="40" y="280" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="107" y="298" text-anchor="middle" dominant-baseline="central">Noyau</text><text class="ts" x="107" y="318" text-anchor="middle" dominant-baseline="central">règles + oracle</text></g>
<g class="c-amber"><rect x="350" y="280" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="298" text-anchor="middle" dominant-baseline="central">P2</text><text class="ts" x="417" y="318" text-anchor="middle" dominant-baseline="central">#63, voir détail</text></g>
<line x1="175" y1="308" x2="193" y2="308" class="arr" marker-end="url(#arrow)"/>
<path d="M572 336 L572 353 L107 353 L107 368" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="195" y="370" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="388" text-anchor="middle" dominant-baseline="central">S3141 et R3</text><text class="ts" x="262" y="408" text-anchor="middle" dominant-baseline="central">#66</text></g>
<g><rect class="box" x="505" y="440" width="135" height="46" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="572" y="455" text-anchor="middle" dominant-baseline="central">v10 → staging</text><text class="ts" x="572" y="473" text-anchor="middle" dominant-baseline="central">PR 27, brouillon</text></g>

<!-- 4. Détail de l'étape en cours, cadre jaune en pointillés -->
<rect x="30" y="502" width="620" height="154" rx="10" fill="none" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="44" y="520" dominant-baseline="central">Détail de P2</text>
<g class="c-gray"><rect x="525" y="534" width="110" height="50" rx="8" stroke-width="0.5"/><text class="th" x="580" y="550" text-anchor="middle" dominant-baseline="central">P2.2 ALD</text><text class="ts" x="580" y="569" text-anchor="middle" dominant-baseline="central">#139, manque doc</text></g>

<!-- 5. En parallèle -->
<text class="ts" x="40" y="680" dominant-baseline="central">En parallèle</text>
<g class="c-blue"><rect x="40" y="694" width="190" height="50" rx="8" stroke-width="0.5"/><text class="th" x="135" y="710" text-anchor="middle" dominant-baseline="central">01 Vocabulaire</text><text class="ts" x="135" y="729" text-anchor="middle" dominant-baseline="central">CONTEXT.md à écrire</text></g>

<!-- 6. Légende, toujours en entier -->
<rect class="c-green" x="40" y="821" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="60" y="828" dominant-baseline="central">Terminé</text>
<rect class="c-amber" x="140" y="821" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="160" y="828" dominant-baseline="central">En cours</text>
<rect class="c-blue" x="240" y="821" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="260" y="828" dominant-baseline="central">Plan fait</text>
<rect class="c-purple" x="340" y="821" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="360" y="828" dominant-baseline="central">Package sans plan</text>
<rect class="c-gray" x="500" y="821" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="520" y="828" dominant-baseline="central">Sans package</text>
</svg>
